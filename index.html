<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PhotoMo - 프리미엄 모자이크 에디터</title>
    <meta name="description" content="손쉽게 사진에 모자이크를 적용하고 저장하세요.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">PhotoMo</h1>
            <div class="header-actions">
                <label class="btn icon-btn" title="새 사진 불러오기">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <input type="file" id="file-upload-toolbar" accept="image/*" hidden>
                </label>
                <button id="btn-compare" class="btn icon-btn" title="원본 비교 (누르고 있으면 원본 표시)" disabled>
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
                <button id="btn-save" class="btn primary-btn" disabled>저장</button>
            </div>
        </header>

        <!-- Main Editor Area -->
        <main class="editor-container">
            <div class="canvas-wrapper">
                <canvas id="main-canvas"></canvas>
                <canvas id="ui-canvas"></canvas>
                <div class="empty-state" id="empty-state">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <p>사진을 선택하여 시작하세요</p>
                    <label class="btn primary-btn upload-btn-large">
                        사진 불러오기
                        <input type="file" id="file-upload-main" accept="image/*" hidden>
                    </label>
                </div>
            </div>
        </main>

        <!-- Bottom Toolbar -->
        <footer class="toolbar">
            <div class="toolbar-group">
                <button id="btn-undo" class="btn icon-btn" title="실행 취소" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" style="display:none"></path><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 015.5 5.5v.5"></path></svg>
                </button>
                <button id="btn-redo" class="btn icon-btn" title="다시 실행" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9.5A5.5 5.5 0 004 14.5v.5"></path></svg>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group tools">
                <button class="btn icon-btn tool-btn active" data-tool="rect" title="사각형 모자이크">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                </button>
                <button class="btn icon-btn tool-btn" data-tool="brush" title="브러쉬 모자이크 (자유영역)">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group intensity-group">
                <label for="intensity">강도: <span id="intensity-val">15</span></label>
                <input type="range" id="intensity" min="5" max="50" value="15">
            </div>

            <div class="toolbar-group intensity-group" id="brush-size-container" style="display: none;">
                <label for="brush-size">굵기: <span id="brush-size-val">30</span></label>
                <input type="range" id="brush-size" min="5" max="100" value="30">
            </div>
            
            </div>
        </footer>
    </div>
    
    <div id="toast-container"></div>
    <script src="app.js?v=1.1"></script>
</body>
</html>
